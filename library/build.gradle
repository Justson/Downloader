apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdkVersion COMPILE_SDK_VERSION.toInteger()
    buildToolsVersion BUILD_TOOL_VERSION

    defaultConfig {
        minSdkVersion 14
        targetSdkVersion TARGET_SDK_VERSION.toInteger()
        versionCode 6
        versionName "5.0.5"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions{
        abortOnError false
    }
    repositories {
        flatDir {
            dirs 'libs', 'providedLibs'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.12'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    androidTestImplementation 'junit:junit:4.12'
    compileOnly 'com.google.android.material:material:1.0.0'
    compileOnly 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.github.Justson:dispatch-queue:v1.0.5'
    // ContextCompat.registerReceiver(..., flags) 在真正被调用（NotificationCancelReceiver 注册），
    // 不是纯注解，必须保证运行时可用，所以用 implementation 而不是 compileOnly；1.9.0 是带
    // exported flag 重载的最低版本，消费方项目通常已有更高版本的 androidx.core，Gradle 按最高版本
    // 决议不会冲突。
    implementation 'androidx.core:core:1.9.0'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Justson'
                artifactId = 'Downloader'
                version = 'v5.0.5-androidx'
            }
        }
    }
}